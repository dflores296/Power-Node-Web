name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El repo público de la norma es la FUENTE de las tablas. Se clona en cada publicación para
      # que el sitio nunca se despegue de ella: si una tabla cambió allá, --check rompe el build
      # aquí en vez de publicar números viejos.
      - name: Clonar NOM-001-SEDE-2012
        run: git clone --depth 1 https://github.com/dflores296/NOM-001-SEDE-2012.git /tmp/nom

      - name: Verificar que las tablas siguen al día
        run: |
          python3 tools/extraer_tablas.py /tmp/nom/data src/PowerNode.Web/wwwroot/datos/tablas-nom.json --check
          python3 tools/extraer_tablas.py /tmp/nom/data tests/PowerNode.Normativa.Tests/datos/tablas-nom.json --check

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet workload install wasm-tools

      # Verde antes de publicar. Normativa: las tablas leídas del JSON dan los MISMOS valores que ya
      # se verificaron a mano contra el PDF del DOF. Web: el cálculo del cuadro de carga, incluidas
      # las pruebas del documento del 2026-09-23 (R-03). Sin la segunda, un cálculo roto se
      # publicaba con el workflow en verde.
      - name: Pruebas
        run: |
          dotnet test tests/PowerNode.Normativa.Tests --configuration Release
          dotnet test tests/PowerNode.Web.Tests --configuration Release

      # Dos reescrituras sobre el index.html publicado:
      #
      # 1. El base href tiene que apuntar al subdirectorio del repo, o los archivos de _framework/
      #    se piden a la raíz del dominio y no cargan nada.
      #
      # 2. El sufijo ?v=<commit> en el CSS. GitHub Pages lo sirve con caché, así que
      #    sin esto un navegador que ya visitó el sitio SIGUE USANDO LOS VIEJOS aunque el despliegue
      #    haya sido correcto -- y el síntoma es de los que hacen perder una tarde, porque la página
      #    "se ve igual" y parece que no se publicó nada. Pasó de verdad el 2026-09-22: el index.html
      #    nuevo llegó con el app.css viejo y la pantalla de carga salió sin formato.
      #
      #    Va con el hash del commit y no a mano (que es como lo hace msa-toolkit, ver su
      #    docs/despliegue.md): un número que hay que acordarse de subir en cada cambio tarde o
      #    temprano no se sube. _framework/ no lo necesita: Blazor ya versiona sus propios archivos.
      #
      #    El CSS y los scripts de js/ (I-57): un teclado.js viejo en caché, junto al tema.js nuevo,
      #    pisaba window.powerNode y el botón del tema tronaba la página. Los iconos NO llevan ?v=:
      #    las query strings en favicons se comportan distinto en cada navegador y hay casos en que lo
      #    hacen ignorar el icono. Ver el comentario largo de wwwroot/index.html.
      - name: Publicar
        run: |
          dotnet publish src/PowerNode.Web --configuration Release --output publicado
          sed -i 's|<base href="/" />|<base href="/Power-Node-Web/" />|g' publicado/wwwroot/index.html
          V="${GITHUB_SHA::7}"
          sed -i "s|href=\"css/app.css\"|href=\"css/app.css?v=$V\"|g" publicado/wwwroot/index.html
          echo "Versión de assets: $V"
          grep -oE 'href="css/app\.css\?v=[a-f0-9]+"' publicado/wwwroot/index.html
          sed -i -E "s#src=\"js/([a-z]+)\.js\"#src=\"js/\\1.js?v=$V\"#g" publicado/wwwroot/index.html
          test "$(grep -cE 'src="js/[a-z]+\.js\?v=[a-f0-9]+"' publicado/wwwroot/index.html)" -eq 3

      # Sin .nojekyll, GitHub Pages ignora _framework/ por empezar con guion bajo, y la página
      # publica "bien" pero no arranca, sin error visible. Es la trampa clásica de Blazor en Pages.
      - name: Asegurar .nojekyll
        run: touch publicado/wwwroot/.nojekyll

      # Recarga en una ruta que no sea la raíz: Pages devolvería 404 porque el archivo no existe.
      # Servir index.html como 404 deja que el enrutador de Blazor la resuelva del lado del cliente.
      - name: 404 que devuelve al enrutador
        run: cp publicado/wwwroot/index.html publicado/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicado/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
