<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Node · Cuadro de carga NOM-001-SEDE-2012</title>
    <meta name="description" content="Calculadora de cuadros de carga según la NOM-001-SEDE-2012. Protección, conductores y caída de tensión, con la cita del artículo de cada resultado. Corre completa en el navegador." />
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />

    <!--
      LOS ICONOS, EN ESTE ORDEN Y CON ESTOS CUATRO ARCHIVOS. No es redundancia: cada uno cubre un
      camino distinto por el que un navegador puede pedir el icono, y el que faltaba costó una
      sesión entera de "sigue saliendo el logo morado de Blazor".

      - favicon.ico EN LA RAÍZ es el que el navegador pide SOLO, sin que nadie se lo diga, y el que
        Chromium/Edge prefieren. La plantilla de Blazor no traía uno: traía favicon.png. Al borrar
        ese PNG sin poner un .ico, el navegador se quedó sin nada que pedir implícitamente y siguió
        mostrando lo que tenía guardado en su base de favicons -- que ni borrar la caché limpia.
      - favicon.png EN LA RAÍZ existe por lo mismo: es la URL exacta que la plantilla usaba. Si algo
        todavía la pide, ahora recibe Power Node en vez de un 404 o del icono viejo.
      - El SVG es el bueno donde se soporte: nítido a cualquier tamaño y con prefers-color-scheme
        adentro, para que la tinta casi negra de la marca no se pierda en una pestaña oscura.
      - El de 180 es el que usa iOS al guardar la página en la pantalla de inicio.

      SIN ?v= A PROPÓSITO, aunque el CSS sí lo lleve: las query strings en favicons se comportan
      distinto en cada navegador y hay casos en que directamente lo hacen ignorar el icono. Un icono
      se versiona cambiándole el nombre al archivo, o no se versiona.
    -->
    <!--
      CON «carta» EN EL NOMBRE (David, 2026-09-25): el logo pasó del unifilar a la carta de Smith, y
      el navegador guarda el icono de la pestaña por URL. Con los nombres de antes seguía mostrando el
      unifilar. favicon.ico y favicon.png de la raíz se quedan (ya con la carta): son los que se piden
      solos.
    -->
    <link rel="icon" href="marca/powernode-carta.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="marca/powernode-carta-favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="marca/powernode-carta-180.png" />
    <!--
      EL TEMA, ANTES DE PINTAR (I-57): tema.js pone <html data-tema="claro|oscuro"> aquí, en el <head> y
      sin defer, para que la página no destelle en claro mientras carga.
    -->
    <script src="js/tema.js"></script>
</head>

<body>
    <!--
      La pantalla de carga. Antes era el <svg class="loading-progress"> de la plantilla de Blazor,
      y salía como UNA BOLA NEGRA: sus dos círculos los dibujan los estilos que la plantilla pone
      en css/app.css, y al reescribir esa hoja se quedaron sin ellos. Un <circle> de SVG sin `fill`
      declarado se pinta negro sólido.

      Se reemplazó por la marca en vez de recuperar aquel indicador: la app pesa ~3.4 MB la primera
      vez y después queda en caché, así que esto se ve unos segundos y conviene que diga de qué
      programa se trata.
    -->
    <div id="app">
        <!--
          La carta va en línea, no en <img>: se dibuja con el avance real de la descarga (I-59). Es copia
          de marca/powernode-icono.svg con currentColor; si el logo cambia, cambiarla también aquí y en
          Layout/BarraSuperior.razor.
        -->
        <div class="arranque" style="--p: 0">
            <svg class="arranque-logo carta-animada" viewBox="0 0 64 64" width="80" height="80" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <g class="finas" stroke-width="1.8">
                        <circle cx="40.667" cy="32" r="17.333" style="--t: .10" />
                        <circle cx="45" cy="32" r="13" style="--t: .20" />
                        <circle cx="49.333" cy="32" r="8.667" style="--t: .30" />
                        <path d="M58,32 A52,52 0 0 1 16.4,11.2" style="--t: .40" />
                        <path d="M58,32 A52,52 0 0 0 16.4,52.8" style="--t: .45" />
                        <path d="M58,32 A26,26 0 0 1 32,6" style="--t: .55" />
                        <path d="M58,32 A26,26 0 0 0 32,58" style="--t: .60" />
                        <path d="M58,32 A13,13 0 0 1 47.6,11.2" style="--t: .70" />
                        <path d="M58,32 A13,13 0 0 0 47.6,52.8" style="--t: .75" />
                        <path d="M6,32 L58,32" style="--t: .82" />
                    </g>
                    <circle class="borde" cx="32" cy="32" r="26" stroke-width="3.5" pathLength="100" />
                </g>
                <circle class="nodo" cx="32" cy="32" r="4.5" fill="#0B6E99" />
            </svg>
            <p class="arranque-nombre">Power Node</p>
            <p class="arranque-nota">Cargando el cálculo y las tablas de la norma… <span class="arranque-pct"></span></p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Algo falló y la página no puede seguir.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>
    <!--
      EL AVANCE DE LA DESCARGA (I-59). Blazor lo publica en <html style="--blazor-load-percentage: 42%">
      por cada recurso que baja (onDownloadResourceProgress). Aquí se pasa a --p, de 0 a 1, que es lo
      que dibuja la carta, y al texto. Va antes de blazor.webassembly.js para no perderse el primero.
      Si en 1.5 s no llega ningún avance, la carta se muestra completa: nunca se queda en blanco.
    -->
    <script>
        (() => {
            const arranque = document.querySelector('.arranque');
            const texto = arranque.querySelector('.arranque-pct');
            const raiz = document.documentElement;
            let recibido = false;
            const observador = new MutationObserver(() => {
                if (!arranque.isConnected)
                    return observador.disconnect(); // ya arrancó la aplicación
                const avance = parseFloat(raiz.style.getPropertyValue('--blazor-load-percentage'));
                if (Number.isNaN(avance))
                    return;
                recibido = true;
                arranque.style.setProperty('--p', Math.min(avance, 100) / 100);
                texto.textContent = Math.floor(avance) + ' %';
            });
            observador.observe(raiz, { attributes: true, attributeFilter: ['style'] });
            setTimeout(() => { if (!recibido) arranque.style.setProperty('--p', 1); }, 1500);
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- El teclado de la captura: Enter, flechas, Esc, atajos, barra de ayuda — I-55, I-56. -->
    <script src="js/teclado.js"></script>
</body>

</html>
