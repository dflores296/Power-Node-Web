<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Node · Cuadro de carga NOM-001-SEDE-2012</title>
    <meta name="description" content="Calculadora de cuadros de carga según la NOM-001-SEDE-2012. Protección, conductores y caída de tensión, con la cita del artículo de cada resultado. Corre completa en el navegador." />
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />

    <!--
      LOS ICONOS, EN ESTE ORDEN Y CON ESTOS CUATRO ARCHIVOS. No es redundancia: cada uno cubre un
      camino distinto por el que un navegador puede pedir el icono, y el que faltaba costó una
      sesión entera de "sigue saliendo el logo morado de Blazor".

      - favicon.ico EN LA RAÍZ es el que el navegador pide SOLO, sin que nadie se lo diga, y el que
        Chromium/Edge prefieren. La plantilla de Blazor no traía uno: traía favicon.png. Al borrar
        ese PNG sin poner un .ico, el navegador se quedó sin nada que pedir implícitamente y siguió
        mostrando lo que tenía guardado en su base de favicons -- que ni borrar la caché limpia.
      - favicon.png EN LA RAÍZ existe por lo mismo: es la URL exacta que la plantilla usaba. Si algo
        todavía la pide, ahora recibe Power Node en vez de un 404 o del icono viejo.
      - El SVG es el bueno donde se soporte: nítido a cualquier tamaño y con prefers-color-scheme
        adentro, para que la tinta casi negra de la marca no se pierda en una pestaña oscura.
      - El de 180 es el que usa iOS al guardar la página en la pantalla de inicio.

      SIN ?v= A PROPÓSITO, aunque el CSS sí lo lleve: las query strings en favicons se comportan
      distinto en cada navegador y hay casos en que directamente lo hacen ignorar el icono. Un icono
      se versiona cambiándole el nombre al archivo, o no se versiona.
    -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="marca/powernode-favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="marca/powernode-180.png" />
</head>

<body>
    <!--
      La pantalla de carga. Antes era el <svg class="loading-progress"> de la plantilla de Blazor,
      y salía como UNA BOLA NEGRA: sus dos círculos los dibujan los estilos que la plantilla pone
      en css/app.css, y al reescribir esa hoja se quedaron sin ellos. Un <circle> de SVG sin `fill`
      declarado se pinta negro sólido.

      Se reemplazó por la marca en vez de recuperar aquel indicador: la app pesa ~3.4 MB la primera
      vez y después queda en caché, así que esto se ve unos segundos y conviene que diga de qué
      programa se trata.
    -->
    <div id="app">
        <div class="arranque">
            <img class="arranque-logo" src="marca/powernode-icono.svg" alt="" width="56" height="56" />
            <p class="arranque-nombre">Power Node</p>
            <p class="arranque-nota">Cargando el cálculo y las tablas de la norma…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Algo falló y la página no puede seguir.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <!--
      CAMPOS NUMÉRICOS (David, 2026-09-25 — I-55).
      - Al entrar, se selecciona todo: lo que se teclea reemplaza. Con el cursor a un lado del «20»,
        teclear 5 daba «520» o «205». El mouseup del mismo clic deshacía la selección: se cancela.
      - Un campo obligatorio (data-requerido: F.P., tensión, longitud…) que se vacía recupera su
        valor ANTES de que Blazor lea el cambio. Sin esto el campo quedaba en blanco mientras el
        cálculo seguía con el valor anterior. Se escucha en captura para correr antes que Blazor.
      Los campos de carga no son obligatorios: vacío es 0 (lo resuelve la página).
    -->
    <script>
        document.addEventListener('focusin', e => {
            const el = e.target;
            if (!(el instanceof HTMLInputElement) || el.type !== 'number') return;
            el.dataset.previo = el.value;
            el.select();
            el.addEventListener('mouseup', ev => ev.preventDefault(), { once: true });
        });
        document.addEventListener('change', e => {
            const el = e.target;
            if (el instanceof HTMLInputElement && el.type === 'number' && el.hasAttribute('data-requerido')
                && el.value.trim() === '' && el.dataset.previo)
                el.value = el.dataset.previo;
        }, true);
    </script>
</body>

</html>
